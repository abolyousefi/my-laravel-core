<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستندات My Laravel Core | زیرساخت مدرن و بومی لاراول</title>

    <!-- Google Fonts: Vazirmatn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">

    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Core UI CSS -->
    <link rel="stylesheet" href="assets/css/core.css">

    <!-- Docs Theme CSS -->
    <link rel="stylesheet" href="assets/css/docs.css">
</head>
<body>

    <!-- Header -->
    <header class="docs-header d-flex align-items-center justify-content-between px-3 px-lg-4">
        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-sm btn-light border d-lg-none" id="mobile-sidebar-toggle" aria-label="منو">
                <i class="fa fa-bars"></i>
            </button>
            <a href="#intro" class="text-decoration-none d-flex align-items-center gap-2">
                <div class="rounded-3 bg-primary text-white d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
                    <i class="fa fa-cubes fs-5"></i>
                </div>
                <div class="d-flex flex-column">
                    <span class="fw-bold fs-6 text-main">My Laravel Core</span>
                    <span class="brand-badge text-center">v1.0.0 • Laravel 10/11/12</span>
                </div>
            </a>
        </div>

        <div class="d-flex align-items-center gap-2">
            <!-- Search Trigger -->
            <button class="docs-search-btn" id="btn-open-search" type="button">
                <i class="fa fa-search"></i>
                <span class="d-none d-sm-inline">جستجو در مستندات...</span>
                <span class="kbd-shortcut d-none d-md-inline">Ctrl K</span>
            </button>

            <!-- Theme Toggle -->
            <button class="btn btn-sm btn-light border rounded-3 p-2" id="theme-toggle" title="تغییر تم تاریک/روشن">
                <i class="fa fa-moon"></i>
            </button>

            <!-- GitHub Link -->
            <a href="https://github.com" target="_blank" class="btn btn-sm btn-dark rounded-3 px-3 d-flex align-items-center gap-2">
                <i class="fab fa-github"></i>
                <span class="d-none d-sm-inline">GitHub</span>
            </a>
        </div>
    </header>

    <!-- Main Docs Wrapper -->
    <div class="docs-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="docs-sidebar" id="docs-sidebar">
            <div class="mb-3 px-2">
                <small class="text-muted fw-bold text-uppercase d-block mb-1">فهرست راهنما</small>
            </div>
            <nav id="sidebar-nav"></nav>
        </aside>

        <!-- Dynamic Content Body -->
        <main class="docs-content" id="main-content">
            <!-- Dynamic content injected by docs.js -->
        </main>
    </div>

    <!-- Search Modal -->
    <div class="search-modal-backdrop" id="search-modal">
        <div class="search-modal-card">
            <div class="position-relative">
                <input type="text" class="search-modal-input" id="search-input" placeholder="جستجو بین کامپوننت‌ها، توابع کمکی، تریت‌ها..." autocomplete="off">
            </div>
            <ul class="search-results-list" id="search-results"></ul>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/docs-data.js"></script>
    <script src="assets/js/docs.js"></script>
</body>
</html>
